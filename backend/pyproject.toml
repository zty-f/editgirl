[project]
name = "editgirl-backend"
version = "0.1.0"
description = "校对女孩后端:智能体 + 校对引擎 + Skill 注册表"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "python-docx>=1.1.0",
    "docx-revisions>=0.1.5",
    "lxml>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
]

[project.scripts]
editgirl-web = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
